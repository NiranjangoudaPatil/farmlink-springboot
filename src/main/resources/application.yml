server:
  port: 8080

spring:
  application:
    name: farmlink
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/farmlink?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none          # schema is owned by Flyway (src/main/resources/db/migration)
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    mapper:
      accept-case-insensitive-enums: true

app:
  jwt:
    # MUST be at least 32 characters. Override with JWT_SECRET in any real environment.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  upload-dir: ${UPLOAD_DIR:uploads}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8081,http://localhost:3000}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
  mail:
    # Set APP_MAIL_ENABLED=true plus SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD to send real emails.
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:FarmLink <no-reply@farmlink.local>}
  admin:
    # If set, an ADMIN account is created on first start (there is no public admin signup).
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:FarmLink Admin}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
